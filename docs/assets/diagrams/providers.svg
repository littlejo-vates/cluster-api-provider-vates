<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 370" width="100%" role="img" aria-label="Cluster API and its providers: the kubeadm and Talos bootstrap and control plane providers converge on the vates-capi infrastructure provider, which talks to the Xen Orchestra API to create VMs, the cluster's nodes.">
  <style>
    .box { fill: currentColor; fill-opacity: 0.05; stroke: currentColor; stroke-width: 1.5; }
    .grp { fill: none; stroke: currentColor; stroke-width: 1; stroke-dasharray: 6 6; opacity: 0.4; }
    .lbl { fill: currentColor; font-family: inherit; font-size: 15px; }
    .strong { font-weight: 600; }
    .cap { fill: currentColor; font-size: 12.5px; opacity: 0.6; letter-spacing: 0.06em; }
    .line { stroke: currentColor; stroke-width: 1.6; opacity: 0.75; fill: none; }
    .tip { fill: currentColor; opacity: 0.75; }
  </style>
  <defs>
    <path id="ah" d="M0,-4 L7,0 L0,4 Z"/>
  </defs>
  <rect class="grp" x="20" y="52" width="336" height="300" rx="16"/>
  <text class="cap" x="36" y="40">CLUSTER API — MANAGEMENT CLUSTER</text>
