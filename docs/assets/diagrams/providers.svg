  <text class="lbl strong" x="0" y="0" text-anchor="middle" transform="translate(505,196) rotate(-90)">vates-capi</text>
  <text class="lbl" x="0" y="0" text-anchor="middle" transform="translate(527,196) rotate(-90)" opacity="0.7">infrastructure provider</text>
  <line class="line" x1="600" y1="205" x2="653" y2="205"/>
  <use class="tip" href="#ah" x="653" y="205"/>
  <rect class="box" x="660" y="120" width="150" height="170" rx="16"/>
  <text class="lbl" x="0" y="0" text-anchor="middle" transform="translate(735,205) rotate(-90)">Xen Orchestra API</text>
  <line class="line" x1="810" y1="205" x2="840" y2="205"/>
  <line class="line" x1="840" y1="120" x2="840" y2="290"/>
  <line class="line" x1="840" y1="120" x2="863" y2="120"/>
