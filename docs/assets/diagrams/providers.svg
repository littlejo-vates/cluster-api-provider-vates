  <text class="lbl" x="185" y="106" text-anchor="middle">Kubeadm control plane provider</text>
  <rect class="box" x="40" y="142" width="290" height="56" rx="10"/>
  <text class="lbl" x="185" y="176" text-anchor="middle">Kubeadm bootstrap provider</text>
  <rect class="box" x="40" y="212" width="290" height="56" rx="10"/>
  <text class="lbl" x="185" y="246" text-anchor="middle">Talos control plane provider</text>
  <rect class="box" x="40" y="282" width="290" height="56" rx="10"/>
  <text class="lbl" x="185" y="316" text-anchor="middle">Talos bootstrap provider</text>
